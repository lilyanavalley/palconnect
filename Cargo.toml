[workspace]
members = ["palconnect-bot", "palconnect-bridge", "palconnect-web"]
resolver = "2"

[workspace.package]
authors = ["Lily Ana Valley <hi@lilyvalley.dev>"]
version = "0.6.6"
edition = "2024"
license = "AGPL-3-or-later"

[workspace.dependencies]
actix-web = "4.11"
chrono = "0.4.42"
log = "0.4.28"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
leptos = { version = "0.8.20", features = ["nightly", "ssr"] }
leptos_actix = "0.8.7"
leptos_meta = "0.8.5"
leptos_router = "0.8.9"

[package]
name = "palconnect"
authors = ["Lily Ana Valley <hi@lilyvalley.dev>"]
version = "0.6.6"
edition = "2024"

[dependencies]
tokio.workspace = true
log.workspace = true
chrono.workspace = true
fern = "0.7"
clap = { version = "4.0", features = ["derive"] }
cargo-packager = { version = "0.11.7", default-features = false }
palconnect-bot = { path = "palconnect-bot" }

[target.'cfg(unix)'.dependencies]
syslog = "7.0.0"
fork = "0.8.0"

[features]
default = []
no-autoupdate = ["palconnect-bot/no-autoupdate"]

[package.metadata.packager]
product-name = "PalConnect"
name = "palconnect"
description = "Community bridge between Discord and PalWorld"
category = "Utility"
homepage = "https://github.com/lilyanavalley/palconnect"
identifier = "dev.lilyvalley.palconnect"
copyright = "Lily Valley, 2025 under AGPL-3-or-later"
license-file = "./COPYING.md"
authors = ["Lily Ana Valley <hi@lilyvalley.dev>"]

before-packaging-command = "cargo build --release"

formats = [
    "dmg",
    "wix", 
    "deb"
]

resources = [
    "Cargo.toml",
    "COPYING.md",
    "README.md",
    "Dockerfile",
    ".dockerignore",
    ".env.example",
    ".editorconfig",
    "src/",
    "scripts/",
    "docs/",
]

